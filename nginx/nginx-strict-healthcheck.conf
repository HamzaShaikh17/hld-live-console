# For scenario 7 (health-check tuning). Copy this over nginx.conf and
# `docker compose restart nginx` to compare against the default/lenient config.
events {}
http {
  upstream app_all {
    server app1:3000 max_fails=1 fail_timeout=2s;
    server app2:3000 max_fails=1 fail_timeout=2s;
    server app3:3000 max_fails=1 fail_timeout=2s;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://app_all;
      proxy_connect_timeout 1s;
      proxy_read_timeout 2s;
    }
  }
}
