<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HLD Failure Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0E1217;
    --panel: #161B22;
    --panel-2: #1C2128;
    --border: #2A313C;
    --text: #E6E8EB;
    --text-dim: #8B95A1;
    --text-faint: #5B6470;
    --accent: #58A6FF;
    --danger: #F0666E;
    --danger-dim: #3A1F22;
    --ok: #4FD68C;
    --ok-dim: #16302A;
    --warn: #E3B341;
    --font-ui: 'IBM Plex Sans', -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #F5F6F8; --panel: #FFFFFF; --panel-2: #F0F1F3; --border: #DCE0E5;
      --text: #1B1F24; --text-dim: #5B6470; --text-faint: #8B95A1;
      --danger-dim: #FCE8E9; --ok-dim: #E4F8EE;
    }
  }
  :root[data-theme="light"] {
    --bg: #F5F6F8; --panel: #FFFFFF; --panel-2: #F0F1F3; --border: #DCE0E5;
    --text: #1B1F24; --text-dim: #5B6470; --text-faint: #8B95A1;
    --danger-dim: #FCE8E9; --ok-dim: #E4F8EE;
  }
  html, body { height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--font-ui); overflow: hidden;
  }
  .app { display: flex; height: 100vh; height: 100dvh; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 300px; min-width: 300px; background: var(--panel);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
  }
  .sidebar-head { padding: 20px 18px 14px; border-bottom: 1px solid var(--border); }
  .sidebar-head h1 { font-size: 15px; font-weight: 600; margin: 0 0 4px; letter-spacing: 0.01em; }
  .sidebar-head p { font-size: 12px; color: var(--text-dim); margin: 0; line-height: 1.5; }
  .problem-list { overflow-y: auto; flex: 1; padding: 8px 0 16px; }
  .group-label {
    font-size: 11px; color: var(--text-faint); padding: 14px 18px 6px;
    display: flex; align-items: center; gap: 8px;
  }
  .group-label .dot { width: 6px; height: 6px; border-radius: 50%; }
  .problem-item {
    width: 100%; text-align: left; background: none; border: none; color: var(--text-dim);
    font-family: var(--font-ui); font-size: 13px; padding: 8px 18px 8px 30px;
    cursor: pointer; display: block; border-left: 2px solid transparent;
    line-height: 1.4;
  }
  .problem-item:hover { background: var(--panel-2); color: var(--text); }
  .problem-item.active {
    background: var(--panel-2); color: var(--text); font-weight: 500;
    border-left-color: var(--accent);
  }

  /* ---------- Main ---------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--panel);
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
    flex-wrap: wrap; gap: 12px;
  }
  .topbar-title { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .topbar-title h2 { font-size: 17px; margin: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cat-pill {
    font-size: 11px; padding: 3px 9px; border-radius: 4px; white-space: nowrap;
    border: 1px solid var(--border); color: var(--text-dim);
  }
  .toggle-wrap { display: flex; align-items: center; gap: 10px; }
  .status-word { font-size: 12px; font-weight: 600; font-family: var(--font-mono); }
  .status-word.broken { color: var(--danger); }
  .status-word.fixed { color: var(--ok); }
  .switch {
    width: 46px; height: 26px; border-radius: 13px; border: 1px solid var(--border);
    background: var(--danger-dim); position: relative; cursor: pointer; transition: background 0.25s ease;
    flex: none;
  }
  .switch.on { background: var(--ok-dim); }
  .switch .knob {
    position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%;
    background: var(--danger); transition: transform 0.25s ease, background 0.25s ease;
  }
  .switch.on .knob { transform: translateX(20px); background: var(--ok); }

  .content { flex: 1; overflow-y: auto; padding: 20px 24px 32px; }
  .empty-state { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-faint); font-size: 13px; text-align: center; padding: 20px; }

  .desc-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .desc-card {
    flex: 1; min-width: 220px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; padding: 14px 16px;
  }
  .desc-card h3 { font-size: 11px; color: var(--text-faint); margin: 0 0 6px; font-weight: 600; }
  .desc-card p { font-size: 13px; margin: 0; line-height: 1.55; color: var(--text); }

  .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .chart-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px 8px;
  }
  .chart-card h3 { font-size: 11px; color: var(--text-faint); margin: 0 0 2px; font-weight: 600; }
  .chart-card .big-num { font-family: var(--font-mono); font-size: 22px; font-weight: 600; margin: 2px 0 8px; }
  .chart-card .big-num.danger { color: var(--danger); }
  .chart-card .big-num.ok { color: var(--ok); }
  .chart-wrap { height: 130px; }

  .logs-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
  }
  .logs-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
  }
  .logs-head h3 { font-size: 11px; color: var(--text-faint); margin: 0; font-weight: 600; }
  .logs-body {
    font-family: var(--font-mono); font-size: 12px; line-height: 1.85; padding: 10px 16px;
    max-height: 260px; overflow-y: auto; background: var(--panel-2);
  }
  .log-line { white-space: pre-wrap; word-break: break-word; }
  .log-line .ts { color: var(--text-faint); }
  .log-line .lvl { font-weight: 600; padding: 0 4px; }
  .lvl-ERROR { color: var(--danger); }
  .lvl-WARN { color: var(--warn); }
  .lvl-INFO { color: var(--text-dim); }

  .fix-row { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 16px; }
  .fix-card { flex: 1; min-width: 220px; border-radius: 6px; padding: 14px 16px; border: 1px solid var(--border); }
  .fix-card.solution { background: var(--ok-dim); }
  .fix-card.tradeoff { background: var(--panel); }
  .fix-card h3 { font-size: 11px; margin: 0 0 6px; font-weight: 600; color: var(--text-faint); }
  .fix-card p { font-size: 13px; margin: 0; line-height: 1.55; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }

  @media (max-width: 820px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; min-width: 0; max-height: 40vh; border-right: none; border-bottom: 1px solid var(--border); }
    .charts-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-head">
      <h1>HLD Failure Console</h1>
      <p>30 recurring system-design problems. Pick one to see it break, then fix it.</p>
    </div>
    <nav class="problem-list" id="problemList"></nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-title">
        <h2 id="topTitle">Select a problem</h2>
        <span class="cat-pill" id="topCat"></span>
      </div>
      <div class="toggle-wrap" id="toggleWrap" style="display:none;">
        <span class="status-word broken" id="statusWord">BROKEN</span>
        <div class="switch" id="switchEl"><div class="knob"></div></div>
      </div>
    </div>
    <div class="content" id="content">
      <div class="empty-state">Choose a problem on the left — each one comes with simulated metrics, traffic, and logs you can flip between broken and fixed.</div>
    </div>
  </main>
</div>

<script>
// ---------------------------------------------------------------
// Data: the 30-problem catalog (condensed)
// ---------------------------------------------------------------
const CATS = {
  Scaling:     { color: '#58A6FF' },
  Availability:{ color: '#E3B341' },
  Consistency: { color: '#F0666E' }
};

const PROBLEMS = [
  {id:'s1', cat:'Scaling', title:'Single Server Bottleneck', symptom:'One machine hits its CPU/memory/disk ceiling; latency climbs even though the code hasn\'t changed.', cause:'All requests served by one process with a hard physical ceiling.', fix:'Horizontal scaling behind a load balancer, after making the service stateless.', tradeoff:'Adds fleet coordination: health checks, rolling deploys across many boxes.', logBroken:'app-1 event-loop lag 340ms - CPU pegged at 100%', logFixed:'traffic spread across 4 instances - CPU 38% avg'},
  {id:'s2', cat:'Scaling', title:'Database Read Contention', symptom:'Read queries queue up as traffic grows, even though writes are fine.', cause:'All reads hit the single primary, sharing its throughput ceiling with writes.', fix:'Read replicas plus a cache layer (Redis/Memcached) in front of the hottest reads.', tradeoff:'Introduces replication lag - a read right after a write can be stale.', logBroken:'pg primary: 940 active connections, read queue depth 212', logFixed:'cache hit ratio 94% - primary connections down to 61'},
  {id:'s3', cat:'Scaling', title:'Database Write Bottleneck', symptom:'Even with read replicas added, the system still degrades - writes are now the ceiling.', cause:'A single-leader database only accepts writes on one node.', fix:'Partitioning/sharding by a hash-based key across multiple write nodes.', tradeoff:'Cross-shard joins/queries become expensive or impossible.', logBroken:'pg primary: WAL write latency p99 1840ms', logFixed:'writes distributed across 4 shards - p99 62ms'},
  {id:'s4', cat:'Scaling', title:'Hotspotting / Uneven Load', symptom:'One shard is overwhelmed while others sit idle, despite "enough" total capacity.', cause:'Range-based partitioning or a viral key concentrates traffic on one node.', fix:'Hash-based or consistent-hash partitioning instead of range-based.', tradeoff:'Loses efficient range queries across the partitioned key.', logBroken:'shard-2 CPU 97% - shard-0,1,3 CPU <15%', logFixed:'load spread evenly - all shards 40-55% CPU'},
  {id:'s5', cat:'Scaling', title:'The Celebrity Problem (Fan-out)', symptom:'One post from a high-follower account needs to reach millions instantly.', cause:'Fan-out-on-write and fan-out-on-read both fail cleanly at extreme ratios.', fix:'Hybrid fan-out: push for normal accounts, pull-and-merge for huge ones.', tradeoff:'Two code paths, plus edge cases when a normal account suddenly goes viral.', logBroken:'fanout queue backlog 2.4M messages, growing', logFixed:'celebrity posts routed to pull-model - queue backlog 0'},
  {id:'s6', cat:'Scaling', title:'Cache Stampede', symptom:'A hot cache key expires; thousands of requests miss simultaneously and slam the DB.', cause:'TTL expiry has no coordination between concurrent requesters.', fix:'Single-flight locking - first miss repopulates, others wait briefly.', tradeoff:'Waiting requests pay a small added latency instead of hitting the DB.', logBroken:'cache miss x1847 in 400ms window - db CPU 96%', logFixed:'cache miss x1 (lock holder) - 1846 requests served from lock-wait'},
  {id:'s7', cat:'Scaling', title:'Connection Pool Exhaustion', symptom:'"Could not acquire connection" errors even though the DB itself isn\'t overloaded.', cause:'Every app instance opens its own pool; the sum exceeds the DB\'s connection limit.', fix:'A connection pooler (PgBouncer/RDS Proxy) multiplexing many app connections onto few DB connections.', tradeoff:'Another component to operate, another hop of latency, a new potential SPOF.', logBroken:'FATAL: remaining connection slots reserved - pool exhausted', logFixed:'pgbouncer: 480 client conns multiplexed onto 20 db conns'},
  {id:'s8', cat:'Scaling', title:'Traffic Spike \u2192 Cascading Latency', symptom:'A sudden request spike causes latency to balloon non-linearly.', cause:'Little\'s Law: rising arrival rate with fixed capacity grows in-flight requests until concurrency runs out.', fix:'Autoscaling on a leading indicator, plus rate limiting/load shedding at the edge.', tradeoff:'Load shedding means some users are deliberately rejected during a spike.', logBroken:'in-flight requests 8400, thread pool exhausted', logFixed:'edge rate-limit shed 12% of burst - in-flight requests stable at 340'},
  {id:'s9', cat:'Scaling', title:'Inefficient Queries (N+1)', symptom:'One logical operation issues far more DB queries than necessary.', cause:'Loop-based code issuing one query per row instead of batching.', fix:'Batched queries (WHERE id IN (...)) or a data-loader pattern.', tradeoff:'Batching can over-fetch data some rows didn\'t need.', logBroken:'query count: 201 (1 + 200 per-row lookups), 640ms total', logFixed:'query count: 2 (batched), 18ms total'},
  {id:'s10', cat:'Scaling', title:'Data Growth Exceeding Storage', symptom:'A single node\'s disk fills up, or index sizes degrade query performance.', cause:'Unbounded data growth against a fixed single-node disk ceiling.', fix:'Partitioning plus archival of cold data to cheaper storage.', tradeoff:'Archived data becomes slower to access if ever needed again.', logBroken:'disk usage 97% on pg-primary, autovacuum falling behind', logFixed:'cold partitions archived to object storage - disk usage 41%'},

  {id:'a1', cat:'Availability', title:'Single Point of Failure', symptom:'One component\'s failure takes the entire system down.', cause:'A critical component was never made redundant.', fix:'Run at least two instances across separate failure domains, with active-active or active-passive failover.', tradeoff:'At least doubles the cost of that component.', logBroken:'db-primary unreachable - 100% of requests failing', logFixed:'failover to db-standby-2 complete in 1.2s - 0% error rate'},
  {id:'a2', cat:'Availability', title:'Cascading Failure', symptom:'One slow dependency\'s slowness spreads and takes down otherwise-healthy services.', cause:'The calling service has no isolation - requests pile up waiting on it, exhausting its own pool.', fix:'Circuit breakers to stop calling a failing dependency, plus bulkheads to isolate resource pools per dependency.', tradeoff:'A tripped breaker needs a sensible fallback or it just converts a slow failure into a fast one.', logBroken:'checkout-svc thread pool 100% blocked on inventory-svc (avg wait 4800ms)', logFixed:'circuit OPEN on inventory-svc - checkout-svc serving fallback in 4ms'},
  {id:'a3', cat:'Availability', title:'Slow/Incorrect Failure Detection', symptom:'A dead node keeps receiving traffic too long, or a merely-slow node gets killed prematurely.', cause:'Health-check thresholds are miscalibrated - too lenient or too strict.', fix:'Tune interval/timeout/consecutive-failure threshold to the component\'s real behavior.', tradeoff:'More sophisticated checks can themselves misfire on a non-critical dependency.', logBroken:'app-2 returning 502 for 38s before health check marks unhealthy', logFixed:'app-2 marked unhealthy after 2 failed checks (4s) - traffic rerouted'},
  {id:'a4', cat:'Availability', title:'Slow Failover (High RTO)', symptom:'Failure is detected, but recovery takes minutes while the system stays down.', cause:'Active-passive standby needs warming up, or a manual step is required.', fix:'Active-active architecture removes failover delay entirely; automate any remaining failover end-to-end.', tradeoff:'Always-on redundant capacity costs more continuously than a passive standby.', logBroken:'standby promotion in progress... (elapsed 4m12s)', logFixed:'active-active: secondary already serving - 0s failover gap'},
  {id:'a5', cat:'Availability', title:'Untested DR Plans', symptom:'A DR plan exists on paper but the runbook references a decommissioned system.', cause:'DR plans are written once and never executed end-to-end.', fix:'Regular game days that actually trigger the failure and run the real runbook.', tradeoff:'Game days consume real engineering time and carry some intentional risk.', logBroken:'DR drill: step 4 references retired service "legacy-auth" - runbook FAILED', logFixed:'DR drill completed - RTO measured at 6m40s, runbook updated'},
  {id:'a6', cat:'Availability', title:'Split-Brain', symptom:'Two nodes each believe they\'re the sole leader and both accept writes during a partition.', cause:'No mechanism requires majority agreement before acting as leader.', fix:'Consensus algorithms (Raft/Paxos) requiring majority quorum before leadership is granted.', tradeoff:'The system becomes unavailable for writes if too many nodes are unreachable.', logBroken:'WARN: two nodes reporting leader=true - data divergence detected', logFixed:'quorum required (3/5) - only node-2 holds leader lease'},
  {id:'a7', cat:'Availability', title:'Regional Outage', symptom:'An entire cloud region becomes unavailable - every server and network path within it.', cause:'Cloud regions do fail, from provider issues or physical disasters.', fix:'Multi-region deployment with a defined DR tier, plus geo-DNS failover.', tradeoff:'Every tier past "backup and restore" costs meaningfully more standing infrastructure.', logBroken:'region us-east-1: 0/12 health checks passing', logFixed:'geoDNS failed over to eu-west-1 - traffic restored in 40s'},
  {id:'a8', cat:'Availability', title:'Third-Party Dependency Outage', symptom:'Your infra is healthy, but an external API you depend on goes down, and you fail alongside it.', cause:'A synchronous, uninsulated call makes the dependency\'s uptime your ceiling.', fix:'Circuit breaker with graceful fallback, plus async decoupling for non-critical calls.', tradeoff:'Requires deliberately designing what a "degraded but useful" response looks like.', logBroken:'payment-provider timeout x340 in 60s - checkout blocked', logFixed:'payment deferred to retry queue - order accepted, capture pending'},
  {id:'a9', cat:'Availability', title:'Bad Deployment', symptom:'A code deploy - not hardware or traffic - causes an outage, hitting 100% of users at once.', cause:'A change ships to all traffic simultaneously with no gradual validation.', fix:'Canary or blue-green deployment with automated rollback on metric breach.', tradeoff:'Slower full rollout, and two versions must coexist during the window.', logBroken:'v2.4.1: error rate 54% across 100% of traffic', logFixed:'canary 10% - error rate 2.1% isolated, auto-rollback triggered'},
  {id:'a10', cat:'Availability', title:'Resource Exhaustion (Leaks)', symptom:'Performance gradually degrades over hours with no external trigger, then crashes.', cause:'A slow leak - unclosed connections, unbounded caches - accumulates until a limit is hit.', fix:'Health checks including resource thresholds, plus real trend observability.', tradeoff:'Scheduled restarts mask the bug rather than fixing it.', logBroken:'heap usage 3.8GB/4GB and rising - gc pause 1200ms', logFixed:'heap usage stable at 620MB after connection-leak patch'},

  {id:'c1', cat:'Consistency', title:'Race Conditions on Concurrent Writes', symptom:'Two simultaneous decrements both read the same value and both succeed - overselling stock.', cause:'A read-modify-write sequence isn\'t atomic.', fix:'Optimistic concurrency (version checks) or an atomic conditional update.', tradeoff:'Optimistic control requires the app to handle retries on conflict.', logBroken:'stock=1 read by 2 requests - final stock=-1 (oversold)', logFixed:'atomic UPDATE...WHERE stock>0 - 50 succeeded, 50 rejected cleanly'},
  {id:'c2', cat:'Consistency', title:'Replication Lag / Stale Reads', symptom:'A write succeeds, but reading a replica right after returns the old value.', cause:'Asynchronous replication means followers are, by design, sometimes behind.', fix:'Read-your-writes routing to the primary for a short window after a user\'s own write.', tradeoff:'Adds complexity tracking "whose read is this" and reduces replica read-scaling.', logBroken:'replica-1 lag 3400ms - read returned value from t-3.4s', logFixed:'own-write routed to primary - read returned current value'},
  {id:'c3', cat:'Consistency', title:'The Dual-Write Problem', symptom:'A DB write and a queue publish are two steps; a crash between them leaves them inconsistent.', cause:'Writing to two different systems isn\'t a single atomic operation.', fix:'The Outbox Pattern - write the event in the same transaction, publish it reliably afterward.', tradeoff:'Adds an outbox table and a background publisher to build and monitor.', logBroken:'orders=142, notifications_sent=119 - 23 events silently lost', logFixed:'orders=142, notifications_sent=142 - outbox_pending=0'},
  {id:'c4', cat:'Consistency', title:'Distributed Transactions (Saga)', symptom:'One business operation spans services (inventory, payment, shipping) with no shared transaction.', cause:'Each service owns its own data store - no single ACID boundary covers all of them.', fix:'The Saga Pattern - local transactions per step, with compensating actions on failure.', tradeoff:'No clean all-or-nothing guarantee; every step needs a correct compensating action.', logBroken:'payment FAILED after inventory reserved - stock stuck reserved', logFixed:'compensating action released reserved inventory - state consistent'},
  {id:'c5', cat:'Consistency', title:'Conflicting Multi-Leader Writes', symptom:'Two leaders accept conflicting writes to the same record at nearly the same time.', cause:'Multi-leader replication intentionally allows independent writes for availability.', fix:'Conflict resolution - last-write-wins, app-defined merge, or CRDTs.', tradeoff:'Last-write-wins silently discards one side\'s change.', logBroken:'conflicting writes to doc-882 from region-us and region-eu', logFixed:'CRDT merge resolved doc-882 - both edits preserved'},
  {id:'c6', cat:'Consistency', title:'Stale Cache Data', symptom:'The underlying data changes but the cache still serves the old value.', cause:'Cache and source of truth are separate copies with no automatic sync.', fix:'Explicit invalidation on write, plus TTL as a safety net.', tradeoff:'Explicit invalidation is a coupling point easy to forget in a new code path.', logBroken:'cache key product:44 stale for 340s after price update', logFixed:'cache invalidated on write - product:44 fresh immediately'},
  {id:'c7', cat:'Consistency', title:'Clock Skew Affecting Ordering', symptom:'Events from different machines appear out of order despite happening correctly in sequence.', cause:'No two machines\' clocks are perfectly synchronized.', fix:'Logical clocks (Lamport timestamps) for causal ordering instead of wall-clock time.', tradeoff:'Logical clocks give ordering but not real elapsed time between events.', logBroken:'event B (ts=10.001) logged before event A (ts=10.002) - clock drift 40ms', logFixed:'lamport(A)=118 < lamport(B)=119 - causal order preserved'},
  {id:'c8', cat:'Consistency', title:'Idempotency Failures', symptom:'A retried request is treated as new, charging or sending something twice.', cause:'At-least-once delivery means retries happen; non-idempotent ops re-execute their side effect.', fix:'Idempotency keys - server recognizes and replays the original result on retry.', tradeoff:'Requires the client to correctly reuse the same key across retries of the same operation.', logBroken:'charge_id 8891 processed 3x - $30 charged for one $10 order', logFixed:'idempotency-key seen - replaying original result, no new charge'},
  {id:'c9', cat:'Consistency', title:'Distributed Lock Failures', symptom:'A lock is held by a crashed process, or two processes both believe they hold it.', cause:'Network partitions and clock skew make "is the holder still alive" ambiguous.', fix:'Lease-based locks with short TTLs, plus fencing tokens for critical correctness.', tradeoff:'Short TTLs risk expiry while the holder is still legitimately working.', logBroken:'lock job-sync held by dead worker-3 for 240s - job blocked', logFixed:'lease expired after 15s - worker-7 acquired with fencing token 442'},
  {id:'c10', cat:'Consistency', title:'Eventual Consistency Confusing UX', symptom:'A user\'s own action briefly appears not to have taken effect on refresh.', cause:'The system correctly chose availability over strong consistency, but the UI doesn\'t account for the staleness window.', fix:'Optimistic UI updates reflecting the expected result immediately, client-side.', tradeoff:'Occasionally shows a state that must later be corrected if the backend op fails.', logBroken:'user reports "like" missing after refresh - replica lag 800ms', logFixed:'optimistic UI held state locally - no visible gap for the user'}
];

// ---------------------------------------------------------------
// Seeded PRNG so each problem's simulated data is stable, not random-every-click
// ---------------------------------------------------------------
function seedFromString(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return () => {
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  };
}

function buildMetrics(problem, broken) {
  const rand = seedFromString(problem.id + (broken ? 'b' : 'f'));
  const n = 20;
  const latency = [];
  const traffic = [];
  const baseLatency = broken ? 180 : 40;
  const noise = broken ? 260 : 12;
  const baseTraffic = 300;
  for (let i = 0; i < n; i++) {
    let spike = 0;
    if (broken && (i === 8 || i === 9 || i === 14)) spike = 400 + rand() * 500;
    latency.push(Math.round(baseLatency + rand() * noise + spike));
    let trafficDip = (broken && i >= 8 && i <= 15) ? (1 - (rand() * 0.4 + 0.2)) : 1;
    traffic.push(Math.round((baseTraffic + rand() * 60 + i * 4) * trafficDip));
  }
  return { latency, traffic };
}

function buildLogs(problem, broken) {
  const rand = seedFromString(problem.id + (broken ? 'lb' : 'lf'));
  const services = ['api-gateway', 'app-svc', 'cache', 'db-primary', 'worker-1'];
  const genericBroken = [
    'timeout waiting on downstream (2000ms exceeded)',
    'retrying request (attempt 2/3)',
    'connection reset by peer',
    'queue depth increasing: 1200 -> 1850',
    'p99 latency breached SLO threshold'
  ];
  const genericFixed = [
    'request completed in 24ms',
    'health check passed',
    'connection pool: 12/50 in use',
    'cache hit',
    'deployment stable - no alerts firing'
  ];
  const lines = [];
  let t = Date.now() - 20000;
  lines.push({ ts: t, lvl: broken ? 'ERROR' : 'INFO', msg: broken ? problem.logBroken : problem.logFixed });
  for (let i = 0; i < 9; i++) {
    t += Math.round(600 + rand() * 1400);
    const svc = services[Math.floor(rand() * services.length)];
    const pool = broken ? genericBroken : genericFixed;
    const msg = pool[Math.floor(rand() * pool.length)];
    let lvl = 'INFO';
    if (broken) lvl = rand() < 0.55 ? 'ERROR' : (rand() < 0.7 ? 'WARN' : 'INFO');
    else lvl = rand() < 0.85 ? 'INFO' : 'WARN';
    lines.push({ ts: t, lvl, msg: `[${svc}] ${msg}` });
  }
  return lines.sort((a, b) => a.ts - b.ts);
}

function fmtTime(ms) {
  const d = new Date(ms);
  return d.toTimeString().slice(0, 8);
}

// ---------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------
let currentProblem = null;
let broken = true;
let latencyChart = null;
let trafficChart = null;

const listEl = document.getElementById('problemList');
const grouped = {};
PROBLEMS.forEach(p => { (grouped[p.cat] = grouped[p.cat] || []).push(p); });

Object.keys(grouped).forEach(cat => {
  const label = document.createElement('div');
  label.className = 'group-label';
  label.innerHTML = `<span class="dot" style="background:${CATS[cat].color}"></span>${cat}`;
  listEl.appendChild(label);
  grouped[cat].forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'problem-item';
    btn.textContent = p.title;
    btn.id = 'item-' + p.id;
    btn.onclick = () => selectProblem(p.id);
    listEl.appendChild(btn);
  });
});

function selectProblem(id) {
  currentProblem = PROBLEMS.find(p => p.id === id);
  broken = true;
  document.querySelectorAll('.problem-item').forEach(el => el.classList.remove('active'));
  document.getElementById('item-' + id).classList.add('active');
  document.getElementById('toggleWrap').style.display = 'flex';
  document.getElementById('topTitle').textContent = currentProblem.title;
  const catPill = document.getElementById('topCat');
  catPill.textContent = currentProblem.cat;
  catPill.style.color = CATS[currentProblem.cat].color;
  catPill.style.borderColor = CATS[currentProblem.cat].color + '55';
  renderContent();
}

document.getElementById('switchEl').addEventListener('click', () => {
  if (!currentProblem) return;
  broken = !broken;
  renderContent();
});

function renderContent() {
  const el = document.getElementById('switchEl');
  const statusWord = document.getElementById('statusWord');
  el.classList.toggle('on', !broken);
  statusWord.textContent = broken ? 'BROKEN' : 'FIXED';
  statusWord.className = 'status-word ' + (broken ? 'broken' : 'fixed');

  const p = currentProblem;
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="desc-row">
      <div class="desc-card"><h3>What breaks</h3><p>${p.symptom}</p></div>
      <div class="desc-card"><h3>Why it happens</h3><p>${p.cause}</p></div>
    </div>
    <div class="charts-row">
      <div class="chart-card">
        <h3>p99 latency (ms)</h3>
        <div class="big-num ${broken ? 'danger' : 'ok'}" id="latNum">-</div>
        <div class="chart-wrap"><canvas id="latChart"></canvas></div>
      </div>
      <div class="chart-card">
        <h3>Traffic (req/s)</h3>
        <div class="big-num" id="trafNum">-</div>
        <div class="chart-wrap"><canvas id="trafChart"></canvas></div>
      </div>
    </div>
    <div class="logs-card">
      <div class="logs-head"><h3>Live logs (simulated)</h3><span class="cat-pill" style="border-color:transparent;color:var(--text-faint)">${broken ? 'error rate elevated' : 'nominal'}</span></div>
      <div class="logs-body" id="logsBody"></div>
    </div>
    <div class="fix-row">
      <div class="fix-card solution"><h3>Fix applied</h3><p>${p.fix}</p></div>
      <div class="fix-card tradeoff"><h3>Trade-off</h3><p>${p.tradeoff}</p></div>
    </div>
  `;

  const metrics = buildMetrics(p, broken);
  document.getElementById('latNum').textContent = metrics.latency[metrics.latency.length - 1] + 'ms';
  document.getElementById('trafNum').textContent = metrics.traffic[metrics.traffic.length - 1] + '/s';

  const gridColor = getComputedStyle(document.documentElement).getPropertyValue('--border').trim();
  const dimColor = getComputedStyle(document.documentElement).getPropertyValue('--text-faint').trim();
  const chartOpts = (color) => ({
    type: 'line',
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { display: false },
        y: { grid: { color: gridColor }, ticks: { color: dimColor, font: { size: 10 } } }
      },
      elements: { point: { radius: 0 }, line: { tension: 0.35, borderWidth: 2 } }
    }
  });

  if (latencyChart) latencyChart.destroy();
  if (trafficChart) trafficChart.destroy();

  latencyChart = new Chart(document.getElementById('latChart'), {
    ...chartOpts(),
    data: { labels: metrics.latency.map((_, i) => i), datasets: [{ data: metrics.latency, borderColor: broken ? '#F0666E' : '#4FD68C', backgroundColor: 'transparent' }] }
  });
  trafficChart = new Chart(document.getElementById('trafChart'), {
    ...chartOpts(),
    data: { labels: metrics.traffic.map((_, i) => i), datasets: [{ data: metrics.traffic, borderColor: '#58A6FF', backgroundColor: 'transparent' }] }
  });

  const logs = buildLogs(p, broken);
  document.getElementById('logsBody').innerHTML = logs.map(l =>
    `<div class="log-line"><span class="ts">${fmtTime(l.ts)}</span> <span class="lvl lvl-${l.lvl}">${l.lvl.padEnd(5)}</span>${l.msg}</div>`
  ).join('');
}
</script>
